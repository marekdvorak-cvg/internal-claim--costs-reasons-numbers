function ExteriorMonthlyTooltip({ active, payload, label, hoverKey }) {
  if (!active || !payload || !payload.length || !hoverKey) return null;
  const row = payload.find(p => p.dataKey === hoverKey);
  if (!row || row.value <= 0) return null;
  const monthTotal = payload.reduce((s, p) => s + (p.value || 0), 0);
  const cost = (EXTERIOR_MONTHLY_COST[label] && EXTERIOR_MONTHLY_COST[label][hoverKey]) || 0;
  return (
    <div style={{ background: "#20262E", border: "1px solid #333B45", borderRadius: 8, padding: "10px 14px", fontSize: 12.5, minWidth: 220 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 7, color: "#E8EAED", fontWeight: 600, marginBottom: 8 }}>

      <div style={{ display: "flex", justifyContent: "space-between", color: "#C7CCD3", marginBottom: 3 }}>

        <span>Podíl v měsíci</span>

}
